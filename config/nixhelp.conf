# NixHelp Configuration
# Конфигурационный файл для nixhelp

[general]
# Язык интерфейса (ru, en)
language = ru

# Цветной вывод в CLI
color_output = true

# Таймаут для команд (секунды)
timeout = 30

[tui]
# Включить мышь в TUI
enable_mouse = true

# Тема (default, dark, light)
theme = default

[search]
# Максимальное количество результатов поиска
max_results = 20

# Источник поиска (nixpkgs, flakehub)
default_source = nixpkgs

[gc]
# Подтверждение перед очисткой
confirm_before_gc = true

# Глубокая очистка по умолчанию
deep_gc_default = false

[store]
# Показывать размер хранилища
show_store_size = true

# Показывать количество путей
show_path_count = true
