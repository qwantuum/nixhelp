name: Build, Test, and Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types: [created]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libncurses-dev python3

      - name: Setup Nix (optional)
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
        continue-on-error: true

      - name: Build with Python script
        run: |
          python3 scripts/build.py build --verbose

      - name: Build with Nix (if available)
        run: |
          if command -v nix &> /dev/null; then
            nix build
          else
            echo "Nix not available, skipping nix build"
          fi
        continue-on-error: true

      - name: Run tests
        run: |
          python3 scripts/test.py

      - name: Basic binary test
        run: |
          ./nixhelp help
          ./nixhelp store

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixhelp-binary
          path: nixhelp

  publish-release:
    needs: build-and-test
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libncurses-dev

      - name: Build release binary
        run: |
          python3 scripts/build.py build

      - name: Strip binary for size optimization
        run: strip ./nixhelp

      - name: Create checksum
        run: |
          sha256sum ./nixhelp > nixhelp.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nixhelp
            nixhelp.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
